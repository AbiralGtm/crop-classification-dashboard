<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; }
    .lbl { font-family: "Times New Roman", Times, serif; font-size: 15pt; fill: black; text-anchor: middle; }
    .arrow-line { stroke: black; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Row 1: two label sources -->
  <rect class="box" x="30" y="20" width="380" height="110"/>
  <text class="lbl" x="220" y="55"><tspan x="220" dy="0">Manual Labels</tspan><tspan x="220" dy="20">64 points, synthetic placeholders</tspan><tspan x="220" dy="20">(all 8 crop classes)</tspan></text>

  <rect class="box" x="490" y="20" width="380" height="110"/>
  <text class="lbl" x="680" y="55"><tspan x="680" dy="0">ESA WorldCereal</tspan><tspan x="680" dy="20">Real per-pixel labels, &#8805;70% confidence</tspan><tspan x="680" dy="20">(non-crop, maize, wheat only)</tspan></text>

  <!-- Converging arrows -->
  <line class="arrow-line" x1="220" y1="130" x2="400" y2="220" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="680" y1="130" x2="500" y2="220" marker-end="url(#arrow)"/>

  <!-- Row 2: combined -->
  <rect class="box" x="260" y="220" width="380" height="90"/>
  <text class="lbl" x="450" y="257"><tspan x="450" dy="0">Combined Training Set</tspan><tspan x="450" dy="20">used for feature sampling and training</tspan></text>
</svg>
