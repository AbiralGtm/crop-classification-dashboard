<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; }
    .lbl { font-family: "Times New Roman", Times, serif; font-size: 15pt; fill: black; text-anchor: middle; }
    .arrow-line { stroke: black; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Row 1 -->
  <rect class="box" x="30" y="20" width="230" height="90"/>
  <text class="lbl" x="145" y="48"><tspan x="145" dy="0">Frontend</tspan><tspan x="145" dy="18">(Next.js + Leaflet)</tspan><tspan x="145" dy="18">Map draw, dashboard,</tspan><tspan x="145" dy="18">export panel</tspan></text>

  <rect class="box" x="310" y="20" width="230" height="90"/>
  <text class="lbl" x="425" y="57"><tspan x="425" dy="0">Backend API</tspan><tspan x="425" dy="18">(FastAPI)</tspan><tspan x="425" dy="18">Routers, background jobs</tspan></text>

  <rect class="box" x="590" y="20" width="230" height="90"/>
  <text class="lbl" x="705" y="57"><tspan x="705" dy="0">SQLite</tspan><tspan x="705" dy="18">(job store +</tspan><tspan x="705" dy="18">AOI history)</tspan></text>

  <!-- Row 2 -->
  <rect class="box" x="30" y="180" width="230" height="90"/>
  <text class="lbl" x="145" y="217"><tspan x="145" dy="0">Sentinel-2 / Sentinel-1</tspan><tspan x="145" dy="18">/ SRTM / ESA WorldCereal</tspan><tspan x="145" dy="18">(satellite data catalog)</tspan></text>

  <rect class="box" x="310" y="180" width="230" height="90"/>
  <text class="lbl" x="425" y="217"><tspan x="425" dy="0">Google Earth Engine</tspan><tspan x="425" dy="18">(auth, imagery,</tspan><tspan x="425" dy="18">classification)</tspan></text>

  <rect class="box" x="590" y="180" width="230" height="90"/>
  <text class="lbl" x="705" y="217"><tspan x="705" dy="0">Random Forest</tspan><tspan x="705" dy="18">classifier</tspan><tspan x="705" dy="18">(trained per request)</tspan></text>

  <!-- Row 3 -->
  <rect class="box" x="310" y="340" width="230" height="90"/>
  <text class="lbl" x="425" y="377"><tspan x="425" dy="0">Reference data</tspan><tspan x="425" dy="18">(Rupandehi district</tspan><tspan x="425" dy="18">crop statistics)</tspan></text>

  <!-- Horizontal double arrows, row 1 -->
  <line class="arrow-line" x1="262" y1="65" x2="308" y2="65" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="542" y1="65" x2="588" y2="65" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Vertical arrows, row1 -> row2 -->
  <line class="arrow-line" x1="145" y1="112" x2="145" y2="178" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="425" y1="112" x2="425" y2="178" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="705" y1="112" x2="705" y2="178" marker-end="url(#arrow)"/>

  <!-- Horizontal arrows, row 2 -->
  <line class="arrow-line" x1="262" y1="225" x2="308" y2="225" marker-end="url(#arrow)"/>
  <line class="arrow-line" x1="542" y1="225" x2="588" y2="225" marker-end="url(#arrow)"/>

  <!-- Vertical arrow, row2 -> row3 -->
  <line class="arrow-line" x1="425" y1="272" x2="425" y2="338" marker-end="url(#arrow)"/>
</svg>
