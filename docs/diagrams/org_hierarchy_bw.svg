<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>
  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; }
    .lbl { font-family: "Times New Roman", Times, serif; font-size: 22px; fill: black; text-anchor: middle; }
    .lbl-b { font-family: "Times New Roman", Times, serif; font-size: 22px; fill: black; text-anchor: middle; }
    .conn { stroke: black; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Row 1: Managing Director -->
  <rect class="box" x="350" y="20" width="200" height="60"/>
  <text class="lbl-b" x="450" y="55">Managing Director</text>

  <!-- Row 2: CTO / CFO -->
  <rect class="box" x="150" y="140" width="240" height="60"/>
  <text class="lbl-b" x="270" y="175">Chief Technology Officer</text>

  <rect class="box" x="610" y="140" width="240" height="60"/>
  <text class="lbl-b" x="730" y="175">Chief Finance Officer</text>

  <!-- Row 3: Project Manager / Administration -->
  <rect class="box" x="150" y="260" width="240" height="60"/>
  <text class="lbl-b" x="270" y="295">Project Manager</text>

  <rect class="box" x="610" y="260" width="240" height="60"/>
  <text class="lbl-b" x="730" y="285">Administration /</text>
  <text class="lbl-b" x="730" y="303">Accounts</text>

  <!-- Row 4: Developer / Designer / Tester -->
  <rect class="box" x="25" y="380" width="150" height="60"/>
  <text class="lbl-b" x="100" y="415">Developer</text>

  <rect class="box" x="195" y="380" width="150" height="60"/>
  <text class="lbl-b" x="270" y="415">Designer</text>

  <rect class="box" x="365" y="380" width="150" height="60"/>
  <text class="lbl-b" x="440" y="410">Quality</text>
  <text class="lbl-b" x="440" y="428">Assurance</text>

  <!-- Row 5: Intern -->
  <rect class="box" x="160" y="500" width="220" height="60"/>
  <text class="lbl-b" x="270" y="535">Intern</text>

  <!-- Connectors: MD -> CTO, CFO -->
  <path class="conn" d="M 450 80 L 450 110 L 270 110 L 270 136" marker-end="url(#arrow)"/>
  <path class="conn" d="M 450 110 L 730 110 L 730 136" marker-end="url(#arrow)"/>

  <!-- Connectors: CTO -> Project Manager -->
  <path class="conn" d="M 270 200 L 270 256" marker-end="url(#arrow)"/>

  <!-- Connectors: CFO -> Administration -->
  <path class="conn" d="M 730 200 L 730 256" marker-end="url(#arrow)"/>

  <!-- Connectors: Project Manager -> Developer, Designer, Tester -->
  <path class="conn" d="M 270 320 L 270 350 L 100 350 L 100 376" marker-end="url(#arrow)"/>
  <path class="conn" d="M 270 350 L 270 376" marker-end="url(#arrow)"/>
  <path class="conn" d="M 270 350 L 440 350 L 440 376" marker-end="url(#arrow)"/>

  <!-- Connectors: Developer, Designer, Tester -> Intern -->
  <path class="conn" d="M 100 440 L 100 470 L 270 470"/>
  <path class="conn" d="M 440 440 L 440 470 L 270 470"/>
  <path class="conn" d="M 270 440 L 270 496" marker-end="url(#arrow)"/>
</svg>
